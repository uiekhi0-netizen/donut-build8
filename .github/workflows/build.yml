name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: unzip -o "$(ls *-v*.zip | sort -V | tail -1)"
      - run: mvn -f DonutSMP/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: DonutSMP-jar.1.2.0
          path: DonutSMP/target/DonutSMP-*.jar
